name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # the privacy test reads every commit message
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: node --test .github/privacy.test.mjs
      - uses: actions/setup-go@v5
        with: { go-version-file: tailnet/go.mod, cache-dependency-path: tailnet/go.sum }
      # One Go module: the native hive-tailnet, and the browser extension's build of it.
      - run: cd tailnet && go vet ./... && go build -o /dev/null . && GOOS=js GOARCH=wasm go vet . && ./wasm.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build -p hive
      - run: cargo test -p hive -p hive-protocol
