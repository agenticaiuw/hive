# Hive, the iPhone app (phone/ios/build.sh): every push and pull request that touches it builds Hive.ipa and
# tries it on an iPhone simulator. On main it's added to the `latest` release (after each release, and on pushes that only
# change it, which don't release): on its own here, so a phone build that fails never holds back the server and the other devices.
#
# On main it's also signed by the owner, for every iPhone registered to their Apple developer account, and published on
# GitHub Pages: Hive.ipa, the manifest.plist an iPhone installs it from by tapping
# itms-services://?action=download-manifest&url=https://agenticaiuw.github.io/hive/manifest.plist, and phone.json, from which
# Hive Server tells installed iPhones about the newer build (phone/src/lib.rs). Run by hand with an iPhone's UDID (the
# dashboard's "Add this iPhone"), it registers that iPhone first, so the build it makes installs there.
name: phone
on:
  push:
    paths: [phone/ios/**, phone/src/bin/**, dashboard/icon.png, .github/workflows/phone.yml]
  pull_request:
    paths: [phone/ios/**, phone/src/bin/**, dashboard/icon.png, .github/workflows/phone.yml]
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      udid: { description: "The iPhone's UDID (the dashboard copies it); empty only rebuilds", required: false }
      name: { description: "A name for it in your Apple developer account", required: false, default: iPhone }
permissions:
  contents: write
jobs:
  ipa:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-latest
    env:
      # The owner's one secret for it (besides the App Store Connect key the Mac release uses): IOS_CERTIFICATE, their
      # Apple Development certificate (a base64 .p12), and IOS_CERTIFICATE_PASSWORD.
      SIGN: ${{ github.ref == 'refs/heads/main' && secrets.IOS_CERTIFICATE != '' }}
    outputs:
      signed: ${{ env.SIGN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # HiveVersion is the last commit to phone/ios, and the build number counts commits
      - uses: actions/setup-go@v5
        with: { go-version: stable, cache: false }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - if: env.SIGN != 'true' && inputs.udid != ''
        run: echo "::error::Add the IOS_CERTIFICATE and IOS_CERTIFICATE_PASSWORD secrets, then run this on main again." && exit 1
      # The certificate into a keychain of its own, then this build's profiles from App Store Connect (hive-provision).
      - if: env.SIGN == 'true'
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          k=$RUNNER_TEMP/hive.keychain
          security create-keychain -p hive $k && security set-keychain-settings $k && security unlock-keychain -p hive $k
          echo "$IOS_CERTIFICATE" | base64 -d > $RUNNER_TEMP/hive.p12
          security import $RUNNER_TEMP/hive.p12 -k $k -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign > /dev/null
          rm $RUNNER_TEMP/hive.p12
          security set-key-partition-list -S apple-tool:,apple: -s -k hive $k > /dev/null
          security list-keychains -d user -s $k $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning $k | awk '/Apple Development|iPhone Developer/ { print $2; exit }')
          [ -n "$identity" ] || { echo "::error::IOS_CERTIFICATE holds no Apple Development certificate and key"; exit 1; }
          echo "HIVE_IOS_IDENTITY=$identity" >> $GITHUB_ENV
          cargo run --locked --release -q -p hive-phone --bin hive-provision -- target/HivePhone/profiles app.hive.xctrunner app.hive.xctrunner.loopback
      - name: Check the pre-XCTest mount backend
        env:
          CARGO_TARGET_DIR: target/phone-launcher
        run: |
          cargo test --locked --manifest-path phone/ios/Launcher/Cargo.toml
          cargo build --locked --release --target aarch64-apple-ios --manifest-path phone/ios/Launcher/Cargo.toml
      - run: phone/ios/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: Hive, path: target/Hive.ipa }
      # Full tool and icon-launch checks; their xcresult and probes are kept below.
      - timeout-minutes: 20
        run: phone/ios/build.sh test
      # What failed, as annotations: anyone can read those on a public repo, signed in or not, unlike the log.
      - if: always()
        run: |
          r=target/HivePhone/smoke.xcresult
          [ -d "$r" ] || { echo "::error title=smoke::no xcresult (the test didn't start)"; exit 0; }
          xcrun xcresulttool get test-results tests --path "$r" > tests.json 2>/dev/null || true
          python3 - <<'EOF'
          import json
          def walk(n, path):
              name = n.get("name", "")
              if n.get("nodeType") == "Test Case" and n.get("result") == "Failed":
                  why = [c.get("name", "") for c in n.get("children", []) if c.get("nodeType") == "Failure Message"]
                  print(f"::error title={name}::{' | '.join(why)[:900] or 'failed'}")
              if n.get("nodeType") == "Test Case" and n.get("result") == "Passed":
                  print(f"::notice title={name}::passed")
              for c in n.get("children", []): walk(c, path + [name])
          try:
              for t in json.load(open("tests.json")).get("testNodes", []): walk(t, [])
          except Exception as e:
              print(f"::error title=smoke::couldn't read the results: {e}")
          EOF
      # What iOS said about Hive's window at each step (Probe.swift), one annotation per run: under xcodebuild (smoke) and
      # launched from its icon (icon).
      - if: always()
        run: |
          python3 - <<'EOF'
          import glob, json, os
          d = "target/HivePhone/probe"
          def say(kind, title, lines):
              print(f"::{kind} title={title}::" + "%0A".join(l.replace("%", "%25") for l in lines)[:6000])
          for run in ("smoke", "icon"):
              f = f"{d}/probe-{run}.log"
              if not os.path.exists(f):
                  say("error", f"probe {run}", [f"no probe log: the runner's test never got to its window ({run})"])
                  continue
              out = []
              for l in open(f):
                  try:
                      s = json.loads(l)
                  except Exception:
                      out.append(l.strip())
                      continue
                  sc = "; ".join(f"{x['class']} {x['state']} w{x['windows']} key={x['keyWindow']}" for x in s.get("scenes", [])) or "no scenes"
                  w = s.get("window")
                  w = f"window inScene={w['inScene']} {w['sceneState']} key={w['key']} hidden={w['hidden']} reload={w['reload']} web={w.get('web')} page={w.get('page')}" if isinstance(w, dict) else "no window"
                  out.append(f"{s.get('n')}. {s.get('step')} | app={s.get('app')} delegate={s.get('delegate')} manifest={s.get('sceneManifest')} | {sc} | {w} | taps={s.get('taps')} calls={s.get('calls', [])}")
              say("notice", f"probe {run}", out)
          notes = []
          for f in ["target/HivePhone/disk-image.txt"] + sorted(glob.glob(f"{d}/host.txt") + glob.glob(f"{d}/std*.txt")):
              if not os.path.exists(f):
                  continue
              lines = [l.strip() for l in open(f, errors="replace").read().splitlines() if l.strip()]
              failures = [l for l in lines if "Terminating app" in l or "reason:" in l or "Hive XCTest settings" in l]
              tail = failures[-3:] + lines[-12:]
              notes += [f"{os.path.basename(f)}: {l}" for l in tail]
          say("notice", "probe host", notes or ["nothing from the host"])
          EOF
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: |
            target/HivePhone/smoke.xcresult
            target/HivePhone/probe
          if-no-files-found: ignore
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload latest target/Hive.ipa --clobber
      - if: env.SIGN == 'true'
        uses: actions/upload-pages-artifact@v3
        with: { path: target/pages }
  # The signed build on GitHub Pages (Settings > Pages > Source: GitHub Actions), all three files at once.
  pages:
    needs: ipa
    if: needs.ipa.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}manifest.plist" }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
