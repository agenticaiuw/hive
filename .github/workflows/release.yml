# Every push to main: GitHub builds what people download from Releases, all under the release tagged `latest`: the server
# (hive-server, its own download) and the devices (the desktop app and the browser extension). `version` goes up last:
# downloaded servers update themselves to it, and their devices follow them. Pushes that only change the iPhone app go
# to phone.yml alone, so they don't cancel a release on its way.
name: release
on:
  push:
    branches: [main]
    paths-ignore: [phone/**, .github/workflows/phone.yml]
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: true
jobs:
  mac:
    runs-on: macos-latest
    # Signed with the repo's Developer ID and notarized with its App Store Connect key, here and only here: every Mac downloads
    # this build (Safari runs Hive for Safari only from a notarized app). People download Hive-Mac.dmg (Hive.app beside a
    # shortcut to Applications); installed apps update from Hive-Mac.zip. The server goes out the same way, as Hive-Server.dmg
    # (and Hive Server.app in hive-server-macos.zip, for older links): macOS warns about malware on any bare program a browser
    # downloads, notarized or not, since only an app can carry its ticket. Servers update from the bare hive-server-macos.
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # the devices' version is the last commit to their code
      - run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      # The extension's Tailscale (tailnet/wasm.go into browser/tailnet/), built here and never committed (it's large), before
      # Hive for Safari takes in browser/.
      - uses: actions/setup-go@v5
        with: { go-version-file: tailnet/go.mod, cache-dependency-path: tailnet/go.sum }
      - run: tailnet/wasm.sh
      - run: |
          cargo build --release -p hive -p hive-server --target aarch64-apple-darwin
          cargo build --release -p hive -p hive-server --target x86_64-apple-darwin
          mkdir out
          for p in hive hive-server; do lipo -create -output out/$p-macos target/{aarch64,x86_64}-apple-darwin/release/$p; done
      - env:
          MAC_CERT: ${{ secrets.MAC_CERT }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          echo "$MAC_CERT" | base64 -d > cert.p12 && echo "$ASC_KEY_P8" | base64 -d > key.p8
          security create-keychain -p ci ci.keychain && security list-keychains -d user -s ci.keychain && security unlock-keychain -p ci ci.keychain
          security import cert.p12 -k ci.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign && rm cert.p12
          security set-key-partition-list -S apple-tool:,apple: -s -k ci ci.keychain > /dev/null
          id=$(security find-identity -v -p codesigning | awk '/Developer ID Application/ { print $2; exit }')
          notarize() { xcrun notarytool submit "$1" --key key.p8 --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait | tee notary.log; grep -q "status: Accepted" notary.log; }
          desktop/mac/bundle.sh out/Hive.app out/hive-macos
          ditto -c -k --keepParent out/Hive.app app.zip && notarize app.zip && xcrun stapler staple out/Hive.app
          ditto -c -k --keepParent out/Hive.app out/Hive-Mac.zip
          codesign -s "$id" -o runtime --timestamp out/hive-server-macos
          server/mac/bundle.sh "out/Hive Server.app" out/hive-server-macos
          mkdir s && cp -R out/hive-server-macos "out/Hive Server.app" s/ && ditto -c -k s server.zip && notarize server.zip
          xcrun stapler staple "out/Hive Server.app"
          ditto -c -k --keepParent "out/Hive Server.app" out/hive-server-macos.zip
          # What people download: a disk image with Hive Server alone, to double-click: it installs itself into Applications,
          # puts the disk image away and opens (server/mac/App.swift). The app never lands in Downloads, as a zip's would.
          mkdir sdmg && mv "out/Hive Server.app" sdmg/
          hdiutil create -volname "Install Hive Server" -srcfolder sdmg -format UDZO out/Hive-Server.dmg
          codesign -s "$id" --timestamp out/Hive-Server.dmg && notarize out/Hive-Server.dmg && xcrun stapler staple out/Hive-Server.dmg
          rm -rf sdmg
          mkdir dmg && mv out/Hive.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Hive -srcfolder dmg -format UDZO out/Hive-Mac.dmg
          codesign -s "$id" --timestamp out/Hive-Mac.dmg && notarize out/Hive-Mac.dmg && xcrun stapler staple out/Hive-Mac.dmg
          rm -rf key.p8 app.zip server.zip notary.log s dmg
      # What people download must open with macOS's plain "downloaded from the internet" question, never "Apple could not
      # verify it is free of malware". This checks each one as a browser would leave it, and stops the release if any fails.
      - run: |
          v=$(mktemp -d) && ditto -x -k out/hive-server-macos.zip "$v/server" && ditto -x -k out/Hive-Mac.zip "$v/app"
          approved() { spctl -a -vv "$@" 2>&1 | tee check.log; grep -q "accepted" check.log && grep -q "source=Notarized Developer ID" check.log; }
          for a in "$v/server/Hive Server.app" "$v/app/Hive.app"; do
            xattr -w -r com.apple.quarantine "0081;$(printf %x "$(date +%s)");Safari;" "$a"
            approved -t exec "$a" && xcrun stapler validate "$a"
          done
          for d in out/Hive-Mac.dmg out/Hive-Server.dmg; do
            approved -t open --context context:primary-signature "$d" && xcrun stapler validate "$d"
          done
          rm -rf "$v" check.log
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: out }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # the devices' version is the last commit to their code
      - run: cargo build --release -p hive -p hive-server
      - shell: bash
        run: mkdir out && cp target/release/hive.exe out/hive-windows.exe && cp target/release/hive-server.exe out/hive-server-windows.exe
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out }
  linux:
    strategy:
      matrix: { os: [ubuntu-22.04, ubuntu-22.04-arm] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # the devices' version is the last commit to their code
      - run: cargo build --release -p hive-server && mkdir out && cp target/release/hive-server out/hive-server-linux-$(uname -m)
      - uses: actions/upload-artifact@v4
        with: { name: "linux-${{ matrix.os }}", path: out }
  # Tailscale built into Hive (tailnet/): one Go build per computer, cross-compiled here. Hive fetches it with a program, not a
  # browser, so the Mac's copy needs no notarization (Go signs it ad hoc, which Apple silicon requires).
  tailnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: tailnet/go.mod, cache-dependency-path: tailnet/go.sum }
      - working-directory: tailnet
        env: { CGO_ENABLED: "0" }
        run: |
          mkdir -p ../out
          for t in darwin/arm64:macos-arm64 darwin/amd64:macos-x86_64 linux/amd64:linux-x86_64 linux/arm64:linux-aarch64 windows/amd64:windows.exe; do
            GOOS=${t%%/*} GOARCH=$(echo ${t%%:*} | cut -d/ -f2) go build -trimpath -ldflags=-s -o ../out/hive-tailnet-${t#*:} .
          done
      - uses: actions/upload-artifact@v4
        with: { name: tailnet, path: out }
  publish:
    needs: [mac, windows, linux, tailnet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      # The extension's Tailscale (tailnet/wasm.go into browser/tailnet/), built here and never committed: it's large.
      - uses: actions/setup-go@v5
        with: { go-version-file: tailnet/go.mod, cache-dependency-path: tailnet/go.sum }
      - run: tailnet/wasm.sh
      - run: cd browser && zip -qr ../out/Hive-Browser.zip . -x '.*' 'tailnet/*' && zip -q ../out/Hive-Browser.zip tailnet/tailnet.wasm tailnet/wasm_exec.js
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only the release's source archives follow the tag. GitHub refuses this token a tag move across changed workflow
          # files, and that mustn't stop the downloads.
          git tag -f latest && git push -f origin latest || echo "::warning::the latest tag stays where it was"
          gh release view latest > /dev/null 2>&1 || gh release create latest --title "Hive" --notes "Built from main on every push."
          gh release upload latest out/* --clobber
          echo "${GITHUB_SHA::12}" > version && gh release upload latest version --clobber
          # One release, `latest`, whose files every push replaces: GitHub shows when it was first made, so its title says
          # when these files were built.
          gh release edit latest --title "Hive, built $(date -u '+%b %-d %H:%M UTC') from ${GITHUB_SHA::7}" --notes "Built from main at ${GITHUB_SHA::12}."
