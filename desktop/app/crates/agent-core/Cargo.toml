[package]
name = "personal-agent-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Durable session primitives for the personal agent"

[dependencies]
aes-gcm = "0.10.3"
fs4 = "0.6.6"
getrandom = "0.4.3"
libc = "0.2.191"
quick-xml = "0.42.0"
regex = "1.13.1"
rusqlite = "0.41.1"
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10.9"
tempfile = "3"

[lib]
crate-type = ["rlib", "cdylib"]
