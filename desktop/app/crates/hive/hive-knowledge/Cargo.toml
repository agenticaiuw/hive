[package]
name = "hive-knowledge"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Knowledge base, cloud archive, memory search, task recording, session journal, context panel"

[dependencies]
hive-common.workspace = true
hive-core.workspace = true
serde_json.workspace = true
regex.workspace = true
libc.workspace = true
rusqlite = "0.41.1"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "hive-knowledge"
path = "src/bin/hive-knowledge.rs"

[[bin]]
name = "hive-session-journal"
path = "src/bin/hive-session-journal.rs"

[[bin]]
name = "hive-context-panel"
path = "src/bin/hive-context-panel.rs"

[[bin]]
name = "hive-memory-search"
path = "src/bin/hive-memory-search.rs"
