[package]
name = "hive-tasks"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "The owner's instructions to every coding agent (Claude Code, Codex, Hive), kept word for word, split into tasks with a state and a report, and enforced through the harnesses' hooks"

[dependencies]
hive-common.workspace = true
serde_json.workspace = true
regex.workspace = true
libc.workspace = true
rusqlite = "0.41.1"
# The owner's cloud copy of the board (cloud/tasks/worker.js).
ureq = { version = "2.12", features = ["json"] }
# Mac releases (update.rs): the format cloud/vm-agent/version.mjs makes.
base64.workspace = true
flate2 = "1.1"
sha2 = "0.10"

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "hive-tasks"
path = "src/main.rs"
