[package]
name = "hive-workspace"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Virtual workspace bridge, workspace fence/recovery/update, the local request socket"

[dependencies]
hive-common.workspace = true
hive-core.workspace = true
serde_json.workspace = true
serde = "1"
base64.workspace = true
regex.workspace = true
libc.workspace = true
tempfile.workspace = true

[[bin]]
name = "workspace-mcp-bridge"
path = "src/bin/workspace-mcp-bridge.rs"

[[bin]]
name = "workspace-fence"
path = "src/bin/workspace-fence.rs"

[[bin]]
name = "workspace-update"
path = "src/bin/workspace-update.rs"

[[bin]]
name = "workspace-tool"
path = "src/bin/workspace-tool.rs"

[[bin]]
name = "restart-agent-once"
path = "src/bin/restart-agent-once.rs"

[[bin]]
name = "hive-bundle-migration"
path = "src/bin/hive-bundle-migration.rs"
