[package]
name = "hive-mac"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "The Mac: helper (VHID) client, screenshots, desktop, the mac tools, credentials"

[dependencies]
hive-common.workspace = true
personal-agent-core.workspace = true
serde_json.workspace = true
base64.workspace = true
libc.workspace = true
# ScreenCaptureKit (screenshots in-process, with the pointer drawn in, scaled by the capture).
objc2 = "0.6"
block2 = "0.6"
# credentials: the phone's identity and the attempt markers are SHA-256; the phone's UI is XML.
sha2 = "0.10"
quick-xml = "0.42"

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "hive-vhid"
path = "src/bin/hive-vhid.rs"

[[bin]]
name = "hive-credentials"
path = "src/bin/hive-credentials.rs"

[[bin]]
name = "hive-mac-mcp"
path = "src/bin/hive-mac-mcp.rs"
