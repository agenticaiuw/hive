[package]
name = "hive"
edition.workspace = true
version.workspace = true

[dependencies]
hive-protocol = { path = "../protocol" }
ureq = "2"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# Setting up a plugged-in iPhone (phone_setup.rs).
idevice = { git = "https://github.com/jkcoxson/idevice", rev = "c8fff6d7fb2690eaeb591ce510754effa7b1e19b", default-features = false, features = ["usbmuxd", "core_device_proxy", "house_arrest", "remote_pairing", "rsd", "tunnel_tcp_stack", "ring"] }
# Upstream has debug tracing of pairing plists; compile it out in every build.
tracing = { version = "0.1", features = ["max_level_info", "release_max_level_info"] }
tokio = { version = "1", features = ["rt", "time"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
