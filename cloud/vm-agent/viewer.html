<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hive VM browser</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 13px/1.4 -apple-system, system-ui, sans-serif; }
  header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #1b1b1b; border-bottom: 1px solid #333; }
  header strong { color: #f5c518; }
  header span { flex: 1; color: #999; }
  button { background: #2a2a2a; color: #ddd; border: 1px solid #444; border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
  button:hover { background: #333; }
  nav { display: flex; gap: 4px; padding: 6px 12px 0; background: #1b1b1b; border-bottom: 1px solid #333; overflow-x: auto; }
  nav:empty { display: none; }
  .tab { display: flex; align-items: center; max-width: 240px; flex: 0 1 auto; min-width: 90px; border: 1px solid #333; border-bottom: none; border-radius: 6px 6px 0 0; background: #222; }
  .tab.on { background: #111; border-color: #f5c518; }
  .tab button { border: none; background: none; border-radius: 0; padding: 6px 8px; }
  .tab .pick { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; color: #bbb; }
  .tab.on .pick { color: #fff; }
  .tab .x { color: #888; padding: 6px 8px 6px 2px; }
  .tab .x:hover { color: #fff; background: none; }
  main { display: flex; justify-content: center; padding: 12px; }
  #screen { max-width: 100%; max-height: calc(100vh - 110px); border: 1px solid #333; outline: none; cursor: default; user-select: none; -webkit-user-drag: none; }
  #screen.focused { border-color: #f5c518; }
  #keys { position: fixed; left: -1000px; top: 0; width: 10px; height: 10px; opacity: 0; }
</style>
</head>
<body>
<header>
  <strong>Hive VM browser</strong>
  <span id="status">Connecting… Click the picture, then type. What you type goes straight to the VM's browser and is not recorded.</span>
  <button data-site="discord">Discord sign-in</button>
  <button data-site="x">X sign-in</button>
  <button id="link" title="Open a Discord or X link, such as a verify-login link from an email">Open a link…</button>
</header>
<nav id="tabs" aria-label="Tabs and windows in the VM's browser"></nav>
<main><img id="screen" alt="Browser on the VM" draggable="false" tabindex="0"></main>
<textarea id="keys" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Keyboard input for the VM browser"></textarea>
<script>
(() => {
  const screen = document.getElementById('screen');
  const keys = document.getElementById('keys');
  const status = document.getElementById('status');
  const post = (path, body) => fetch(path, { method: 'POST', headers: { 'content-type': 'application/json', 'x-hive-viewer': '1' }, body: JSON.stringify(body) }).catch(() => {});
  const mods = e => (e.altKey ? 1 : 0) | ((e.ctrlKey || e.metaKey) ? 2 : 0) | (e.shiftKey ? 8 : 0);
  const at = e => { const box = screen.getBoundingClientRect(); return { x: (e.clientX - box.left) / box.width, y: (e.clientY - box.top) / box.height }; };

  const frames = new EventSource('/frames');
  frames.onmessage = event => { const frame = JSON.parse(event.data); screen.src = 'data:image/jpeg;base64,' + frame.d; status.textContent = 'Live. Click the picture, then type. What you type goes straight to the VM\'s browser and is not recorded.'; };
  frames.addEventListener('problem', event => { status.textContent = 'Browser problem: ' + JSON.parse(event.data); });

  // Every tab and popup window (such as a "Continue with Google" window) is a tab here.
  const strip = document.getElementById('tabs');
  let shown = null;
  frames.addEventListener('tabs', event => {
    const list = JSON.parse(event.data);
    if (list.shown && list.shown !== shown && shown !== null) {
      const tab = list.tabs.find(t => t.id === list.shown);
      if (tab) status.textContent = 'Showing ' + (tab.title || tab.host || 'a new window') + '.';
    }
    shown = list.shown;
    strip.replaceChildren(...list.tabs.map(tab => {
      const item = document.createElement('span');
      item.className = 'tab' + (tab.id === list.shown ? ' on' : '');
      item.title = tab.host;
      const pick = document.createElement('button');
      pick.className = 'pick';
      pick.textContent = tab.title || tab.host || 'New tab';
      pick.addEventListener('click', () => { post('/tab', { id: tab.id }); keys.focus(); });
      item.append(pick);
      if (!tab.main) {
        const close = document.createElement('button');
        close.className = 'x'; close.textContent = '×'; close.setAttribute('aria-label', 'Close ' + pick.textContent);
        close.addEventListener('click', () => post('/tab', { id: tab.id, close: true }));
        item.append(close);
      }
      return item;
    }));
  });
  frames.onerror = () => { status.textContent = 'Disconnected. Run the sign-in command again if this does not recover.'; };

  let down = false; let lastMove = 0;
  screen.addEventListener('mousedown', e => { e.preventDefault(); keys.focus(); down = true; post('/input', { t: 'm', k: 'mousePressed', ...at(e), c: e.detail, mod: mods(e) }); });
  window.addEventListener('mouseup', e => { if (!down) return; down = false; post('/input', { t: 'm', k: 'mouseReleased', ...at(e), c: e.detail, mod: mods(e) }); });
  screen.addEventListener('mousemove', e => { const now = Date.now(); if (now - lastMove < 40) return; lastMove = now; post('/input', { t: 'm', k: 'mouseMoved', ...at(e), down, mod: mods(e) }); });
  screen.addEventListener('wheel', e => { e.preventDefault(); post('/input', { t: 'w', ...at(e), dx: e.deltaX, dy: e.deltaY, mod: mods(e) }); }, { passive: false });
  screen.addEventListener('contextmenu', e => e.preventDefault());

  keys.addEventListener('focus', () => screen.classList.add('focused'));
  keys.addEventListener('blur', () => screen.classList.remove('focused'));
  const key = (kind, e) => {
    const command = (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'a' ? 'selectAll' : undefined;
    const printable = e.key.length === 1 && !e.metaKey && !e.ctrlKey;
    post('/input', { t: 'k', k: kind, key: e.key, code: e.code, kc: e.keyCode, mod: mods(e), command, text: kind === 'keyDown' ? (printable ? e.key : e.key === 'Enter' ? '\r' : undefined) : undefined });
  };
  keys.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && ['v', 'r', 't', 'w', 'q', 'l'].includes(e.key.toLowerCase())) return; // paste and local browser shortcuts stay local
    if (e.isComposing) return;
    e.preventDefault(); key('keyDown', e);
  });
  keys.addEventListener('keyup', e => { if (e.isComposing) return; e.preventDefault(); key('keyUp', e); });
  keys.addEventListener('paste', e => { e.preventDefault(); const text = e.clipboardData.getData('text'); if (text) post('/input', { t: 'text', text }); });
  keys.addEventListener('compositionend', e => { if (e.data) post('/input', { t: 'text', text: e.data }); keys.value = ''; });
  keys.addEventListener('input', () => { keys.value = ''; });

  document.getElementById('link').addEventListener('click', async () => {
    const url = prompt('Paste a Discord or X link (for example the "verify login" link from an email). It opens in the VM\'s browser, not on this Mac.');
    if (!url) return;
    const response = await post('/go', { url: url.trim() });
    if (!response || !response.ok) status.textContent = 'That link was not opened. Only https links to Discord or X open here.';
    keys.focus();
  });
  for (const button of document.querySelectorAll('button[data-site]')) button.addEventListener('click', () => { post('/go', { site: button.dataset.site }); keys.focus(); });
})();
</script>
</body>
</html>
