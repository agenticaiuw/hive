<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hive</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e0f11; }
      iframe { display: block; width: 100%; height: 100%; border: 0; }
      p { margin: 16px; color: #c9c9c9; font: 14px/1.4 system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <!-- Hive's one dashboard, beside the board Hive on this Mac connected this browser to:
         sidepanel.js fills in the frame's address, since the extension carries none of its own. -->
    <iframe title="Hive's dashboard" allow="microphone; clipboard-read; clipboard-write"></iframe>
    <p id="no-board" hidden></p>
    <script src="sidepanel.js"></script>
  </body>
</html>
