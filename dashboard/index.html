<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hive</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
@font-face { font-family: Figtree; src: url(figtree.woff2) format("woff2"); font-weight: 300 900; font-display: swap; }
:root { --bg: #fafafa; --fg: #202020; --muted: #707070; --line: #e5e5e5; --card: #fff; --accent: #b45309; --ok: #15803d; --warn: #b91c1c; }
@media (prefers-color-scheme: dark) { :root { --bg: #181818; --fg: #eeeeee; --muted: #a3a3a3; --line: #303030; --card: #202020; --accent: #f59e0b; --ok: #4ade80; --warn: #f87171; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 Figtree, -apple-system, system-ui, sans-serif; }
header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header b { font-size: 18px; color: var(--accent); }
nav { display: flex; gap: 4px; flex-wrap: wrap; padding: 8px 16px; border-bottom: 1px solid var(--line); }
nav a { padding: 4px 10px; border-radius: 6px; color: var(--muted); text-decoration: none; }
nav a.on { background: var(--card); color: var(--fg); border: 1px solid var(--line); }
#app { height: 100dvh; display: flex; flex-direction: column; }
#app[hidden] { display: none; }
main { padding: 16px; width: 100%; margin: 0 auto; flex: 1; min-height: 0; overflow: auto; }
main.sessions { display: flex; flex-direction: column; overflow: hidden; }
.sessions #view { flex: 1; min-height: 0; }
.session-list { overflow: auto; min-height: 0; overscroll-behavior: contain; padding: 2px; }
.chat-panel { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.chat-panel > .card { flex: 1; min-height: 0; display: flex; flex-direction: column; margin: 0; }
.chat-panel .log { flex: 1; min-height: 0; max-height: none; overflow: auto; overscroll-behavior: contain; overflow-anchor: none; }
.chat-panel .composer { flex-shrink: 0; padding-top: 8px; }
#orchestrator { display: none; }
#orchestrator.active { display: flex; }
.session-list > .item:first-child { position: sticky; top: 0; z-index: 1; }
.session-list .item { overflow-wrap: anywhere; }
.session-list .item:focus-visible { outline: 2px solid var(--accent); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.muted { color: var(--muted); font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--muted); }
.dot.on { background: var(--ok); }
textarea, input { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: inherit; }
button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 7px 14px; font: inherit; cursor: pointer; }
button.plain { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.badge { font-size: 12px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.badge.needs { color: var(--warn); border-color: var(--warn); }
.badge.working { color: var(--accent); border-color: var(--accent); }
.badge.done { color: var(--ok); border-color: var(--ok); }
.log { max-height: 60vh; overflow: auto; font-size: 14px; }
.log > div { padding: 4px 0; border-bottom: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
.chat-log { padding: 12px 4px; }
.chat-log .message { display: flex; border: 0; padding: 8px 0; white-space: normal; }
.chat-log .message-body { min-width: 0; max-width: 100%; white-space: pre-wrap; overflow-wrap: anywhere; }
.chat-log .message.owner { justify-content: flex-end; }
.chat-log .message.owner .message-body { max-width: 80%; padding: 10px 12px; border-radius: 16px; background: var(--line); }
.chat-log .message.agent .message-body { padding: 4px 0; }
.chat-log .activity { padding: 5px 0; color: var(--muted); overflow-wrap: anywhere; }
.chat-log .activity summary { cursor: pointer; }
.chat-log .activity-body { white-space: pre-wrap; }
.chat-log .tool-cell { font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding: 8px 0; border: 0; }
.tool-title { color: var(--fg); white-space: pre-wrap; }
.tool-title > span { color: var(--muted); }
.tool-detail, .tool-output { margin-left: 16px; padding-left: 12px; border-left: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
.tool-cell details { margin-left: 28px; }
.tool-cell pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0; }
.tool-cell.failed .tool-title { color: var(--warn); }
.tool-cell[aria-busy="true"] .tool-title > span { color: var(--accent); }
.chat-log figure.screenshot { margin: 8px 0; }
.log .who { color: var(--accent); font-weight: 600; margin-right: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
td, th { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; max-width: 360px; overflow: hidden; text-overflow: ellipsis; }
.split { display: grid; grid-template-columns: minmax(180px, 300px) minmax(0, 1fr); gap: 12px; height: 100%; min-height: 0; }
.session-toggle { display: none; }
@media (max-width: 760px) {
  header { padding: 8px 12px; flex-wrap: nowrap; }
  #nodes { flex-wrap: nowrap; overflow: auto; white-space: nowrap; min-width: 0; }
  #nodes .dot { flex-shrink: 0; }
  nav { flex-wrap: nowrap; overflow-x: auto; padding: 6px 8px; flex-shrink: 0; }
  nav a { flex-shrink: 0; padding: 10px; }
  main { padding: 8px; }
  .split { display: flex; flex-direction: column; gap: 8px; }
  .session-toggle { display: block; align-self: flex-start; min-height: 44px; }
  .split .session-list { display: none; }
  .split.choosing .session-list { display: block; flex: 1; }
  .split.choosing .chat-panel { display: none; }
  .chat-panel { flex: 1; overflow: hidden; }
  .card { padding: 10px; }
  textarea, input { font-size: 16px; }
  button { min-height: 44px; }
  .composer > .muted { display: none; }
}
.task-board { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
.task-board h2 { font-size: 16px; margin: 0 0 10px; }
.task-board .item { overflow-wrap: anywhere; }
@media (max-width: 760px) { .task-board { grid-template-columns: 1fr; gap: 12px; } }
.item { cursor: pointer; }
.item.sel { outline: 2px solid var(--accent); }
img.screen { width: 100%; border-radius: 8px; border: 1px solid var(--line); }
.composer.dragging { outline: 2px dashed var(--accent); }
.attachments { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.attachment { display: flex; gap: 6px; align-items: center; max-width: 100%; }
.attachment img { width: 64px; height: 64px; object-fit: contain; border-radius: 6px; }
button:disabled { opacity: .5; cursor: wait; }
#login { max-width: 360px; margin: 18vh auto; }

.session-list .item { display:flex; align-items:center; gap:9px; border:0; padding:9px 10px; margin:2px 0; border-radius:7px; min-height:38px; background:transparent; }
.session-list .item:hover, .session-list .item.sel { background:var(--line); outline:none; }
.session-list > .item:first-child { background:var(--bg); margin-bottom:12px; }
.session-title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; }
.session-state { flex-shrink:0; width:8px; height:8px; border-radius:50%; background:var(--muted); }
.session-state.needs { background:var(--warn); }
.session-state.working { border:2px solid var(--line); border-top-color:var(--accent); width:12px; height:12px; animation:running 1s linear infinite; }
.session-state.done { background:transparent; border:1px solid var(--muted); }
.unread { width:6px; height:6px; border-radius:50%; background:var(--accent); flex-shrink:0; }
@keyframes running { to { transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .session-state.working { animation:none; } }
.chat-panel > .card { border:0; background:var(--bg); padding:8px 20px; }
.chat-log { font-size:16px; }
.chat-log > * { max-width:800px; margin-left:auto; margin-right:auto; }
.chat-log .message { padding:14px 0; }
.chat-log .message-time { display:block; color:var(--muted); font:12px/1.5 Figtree, sans-serif; margin-top:6px; }
.chat-log .tool-title .message-time { float:right; margin:0 0 0 12px; }
.chat-log figure.screenshot { display:block; margin:12px auto; }
.screenshot img { display:block; max-width:100%; width:auto; height:auto; max-height:260px; object-fit:contain; border-radius:8px; }
.composer { width:100%; max-width:800px; margin:0 auto; border:1px solid var(--line); border-radius:16px; padding:10px; background:var(--card); }
.composer textarea { resize:none; max-height:160px; border:0; background:transparent; outline:none; }
.composer:focus-within { border-color:var(--muted); }
.composer .row { margin-top:8px; }
.task-board { max-width:1000px; margin:0 auto; }
.task-board section { min-width:0; }
.task-row { display:flex; align-items:center; gap:16px; border-radius:0; border-width:0 0 1px; background:transparent; margin:0; }
.task-open { flex:1; min-width:0; text-align:left; background:transparent; color:var(--fg); padding:0; }
.task-description { display:block; white-space:pre-wrap; overflow-wrap:anywhere; margin-top:6px; font-size:14px; font-weight:normal; }
.task-open .muted { display:block; margin-top:4px; }
.task-need { flex:1; font-size:14px; overflow-wrap:anywhere; }
.attachment { padding:5px; border:1px solid var(--line); border-radius:8px; font-size:13px; overflow-wrap:anywhere; }
@media(max-width:760px) { .chat-panel > .card { padding:4px; } .task-row { flex-wrap:wrap; gap:8px; } .task-open { flex-basis:100%; } .session-list .item { min-height:44px; } .usage { font-size:12px; } .screenshot img { max-height:200px; } }
</style>
</head>
<body>
<div id="login" class="card" hidden>
  <b>Hive</b>
  <p id="loginerr" class="muted"></p>
</div>
<div id="app" hidden>
<header>
  <b>Hive</b><span id="nodes" class="row muted"></span>
</header>
<nav id="tabs"></nav>
<main>
  <div id="orchestrator" class="card"><div class="row"><b>Orchestrator</b><span id="planner-usage" class="muted"></span></div><div id="orchestrator-log" class="log chat-log"></div><div class="composer" data-composer="main">
    <textarea id="ask" rows="2" placeholder="Tell Hive what to do"></textarea>
    <div class="attachments"></div>
    <p class="row" style="margin:8px 0 0"><button class="plain" onclick="this.nextElementSibling.click()">Attach files</button><input type="file" multiple hidden><button data-send onclick="send()">Send</button><span id="reply" class="muted" role="status"></span></p>
    <span class="muted"></span>
  </div>
  </div>
  <div id="view"></div>
</main>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ago = t => { if (!t) return 'never'; const s = (Date.now() - t) / 1000; return s < 60 ? 'now' : s < 3600 ? `${s / 60 | 0}m ago` : s < 86400 ? `${s / 3600 | 0}h ago` : `${s / 86400 | 0}d ago`; };
async function api(path, opts = {}) {
  const r = await fetch(path, { credentials: 'same-origin', ...opts, body: opts.body && typeof opts.body !== 'string' && !(opts.body instanceof Blob) ? JSON.stringify(opts.body) : opts.body });
  if (r.status === 401) { $('#app').hidden = true; $('#login').hidden = false; throw new Error('signed out'); }
  return r.headers.get('content-type')?.includes('json') ? r.json() : r.text();
}
// The server signs in the owner's own devices (through Tailscale) and its own computer by themselves.
async function login() {
  const r = await fetch('api/login', { method: 'POST' });
  if (!r.ok) $('#loginerr').textContent = (await r.json()).error;
  return r.ok;
}
async function forget(id, name) {
  if (!confirm(`Forget ${name}? It stops working with Hive until it joins again.`)) return;
  await api(`api/nodes/${encodeURIComponent(id)}`, { method: 'DELETE' });
  await refresh();
}
async function savePin() {
  const r = await api('api/phone/passcode', { method: 'POST', body: { passcode: $('#pin').value } });
  $('#pin').value = ''; if (r.error) alert(r.error); else render();
}
// GitHub can't fill in a workflow's inputs from a link, so the UDID goes on the clipboard (this page is plain HTTP inside
// the tailnet, where navigator.clipboard isn't offered).
function addPhone(udid, github) {
  const t = document.createElement('textarea'); t.value = udid; document.body.append(t); t.select();
  document.execCommand('copy'); t.remove();
  open(github, '_blank');
}
// Drafts live outside the rendered task pane so polling cannot discard attachments.
const drafts = new Map();
function draft(key) {
  if (!drafts.has(key)) drafts.set(key, { files: [], text: '', busy: false, status: '' });
  return drafts.get(key);
}
function paintComposer(el) {
  const d = draft(el.dataset.composer);
  el.querySelector('.attachments').replaceChildren(...d.files.map(item => {
    const box = document.createElement('div'); box.className = 'attachment';
    const img = document.createElement('img'); img.src = item.url; img.alt = item.file.name;
    const remove = document.createElement('button'); remove.className = 'plain';
    remove.textContent = 'Remove'; remove.setAttribute('aria-label', `Remove ${item.file.name}`);
    remove.disabled = d.busy;
    remove.onclick = () => { d.files.splice(d.files.indexOf(item), 1); URL.revokeObjectURL(item.url); paintComposer(el); };
    const label = document.createElement('span'); label.textContent = item.file.name; if (item.file.type.startsWith('image/')) box.append(img); box.append(label, remove); return box;
  }));
  el.querySelector('[data-send]').disabled = d.busy;
  el.querySelector('[role=status]').textContent = d.status;
  el.querySelector('textarea, input:not([type=file])').disabled = d.busy;
  el.querySelector('input[type=file]').disabled = d.busy;
}
function addPictures(el, files) {
  const d = draft(el.dataset.composer); if (d.busy) return;
  const images = Array.from(files);
  for (const file of images) {
    if (file.size > 25 * 1024 * 1024) { d.status = 'Files must be 25 MB or smaller.'; continue; }
    d.files.push({ file, url: URL.createObjectURL(file), path: null });
  }
  if (!images.length) d.status = 'Choose a file.';
  paintComposer(el);
}
document.addEventListener('change', e => {
  const el = e.target.closest('.composer');
  if (el && e.target.type === 'file') { addPictures(el, e.target.files); e.target.value = ''; }
});
document.addEventListener('input', e => {
  const el = e.target.closest('.composer');
  if (el && e.target.type !== 'file') draft(el.dataset.composer).text = e.target.value;
});
document.addEventListener('paste', e => {
  const el = e.target.closest('.composer'); if (!el) return;
  const files = Array.from(e.clipboardData?.items || []).filter(i => i.type.startsWith('image/')).map(i => i.getAsFile()).filter(Boolean);
  if (files.length) { e.preventDefault(); addPictures(el, files); }
});
for (const event of ['dragover', 'dragleave', 'drop']) document.addEventListener(event, e => {
  const el = e.target.closest('.composer'); if (!el) return;
  if (event === 'dragover' || event === 'drop') e.preventDefault();
  el.classList.toggle('dragging', event === 'dragover');
  if (event === 'drop') addPictures(el, e.dataTransfer.files);
});
async function sendComposer(key, path) {
  const d = draft(key); if (d.busy || (!d.text.trim() && !d.files.length)) return;
  const el = Array.from(document.querySelectorAll('.composer')).find(el => el.dataset.composer === key);
  d.busy = true; d.status = 'Sending…'; paintComposer(el);
  try {
    for (const item of d.files) {
      if (!item.path) {
        const r = await api(`api/files?name=${encodeURIComponent(item.file.name)}`, { method: 'POST', body: item.file });
        if (!r.path) throw new Error(r.error || 'File upload failed');
        item.path = r.path;
      }
    }
    const pictures = d.files.length ? '\n\nAttached files saved on Hive (read these files; include their paths when passing this request to an agent):\n' + d.files.map(i => i.path).join('\n') : '';
    const r = await api(path, { method: 'POST', body: { text: d.text.trim() + pictures, node: 'dashboard' } });
    if (r.error || r.status === 'failed') throw new Error(r.error || r.reply || 'Sending failed');
    d.files.forEach(i => URL.revokeObjectURL(i.url)); d.files = []; d.text = '';
    el.querySelector('textarea, input:not([type=file])').value = '';
    d.status = 'Sent';
  } catch (e) { d.status = `Could not send: ${e.message}. Your draft is kept; try again.`; }
  finally { d.busy = false; if (el.isConnected) paintComposer(el); }
}
async function send() { await sendComposer('main', 'api/requests?wait=1'); refresh(); }
$('#ask').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });

const TABS = ['Sessions', 'Tasks', 'Rules', 'Info', 'Files', 'Nodes', 'Screen', 'Database', 'Tools', 'Log'];
let tab = location.hash.slice(1) || 'Sessions', state = null, chat = null, chatAfter = 0, timer = null, remoteScreen = null, screenRetry = null;
if (['Agents', 'Past'].includes(tab)) tab = 'Sessions';
function tabs() { $('#tabs').innerHTML = TABS.map(t => `<a href="#${t}" class="${t === tab ? 'on' : ''}">${t}</a>`).join(''); }
let boardSelection = null;
addEventListener('hashchange', () => { tab = location.hash.slice(1); if (['Agents', 'Past'].includes(tab)) tab = 'Sessions'; chat = tab === 'Sessions' && boardSelection !== null ? sessionId(boardSelection) : null; boardSelection = null; chatAfter = 0; tabs(); render(); });
function openTask(id) { if (tab === 'Sessions') { openChat(id); return; } boardSelection = id; location.hash = 'Sessions'; }

// Adapted from OpenAI Codex's Apache-2.0 terminal history renderer; see codex-rendering.README.md.
function toolEntry(item) {
  const active = item.status === 'inProgress', failed = item.status === 'failed' || (item.exitCode != null && item.exitCode !== 0);
  let title, detail = '', output = item.aggregatedOutput ?? item.output ?? '';
  if (item.type === 'commandExecution') {
    const actions = item.commandActions || [];
    const explored = actions.length && actions.every(a => ['read', 'search', 'listFiles'].includes(a.type));
    title = explored ? (active ? 'Exploring' : 'Explored') : `${active ? 'Running' : 'Ran'} ${item.command || ''}`;
    if (explored) detail = actions.map(a => a.type === 'read' ? `Read ${a.name || a.path}` : a.type === 'listFiles' ? `List ${a.path || '.'}` : `Search ${a.query || a.command}${a.path ? ' in ' + a.path : ''}`).join('\n');
  } else if (item.type === 'fileChange') {
    title = active ? 'Editing' : 'Edited';
    detail = (item.changes || []).map(c => c.path).join('\n');
    output = (item.changes || []).map(c => c.diff || '').join('\n');
  } else if (item.type === 'webSearch') {
    title = `${active ? 'Searching' : 'Searched'} ${item.query || ''}`;
  } else if (item.type === 'imageView') {
    title = 'Viewed image'; detail = item.path || '';
  } else {
    title = active ? 'Calling' : 'Called';
    detail = `${item.server ? item.server + '.' : ''}${item.tool || ''}(${JSON.stringify(item.arguments ?? {})})`;
    if (!output && item.result) output = typeof item.result === 'string' ? item.result : JSON.stringify(item.result, null, 2);
    if (item.error) output = typeof item.error === 'string' ? item.error : JSON.stringify(item.error);
  }
  if (failed) title += item.exitCode != null ? ` (exit ${item.exitCode})` : ' (failed)';
  const lines = String(output).split('\n');
  const preview = lines.slice(0, 5).join('\n');
  return `<div class="activity tool-cell${failed ? ' failed' : ''}" data-tool-id="${esc(item.id || '')}" aria-busy="${!!active}"><div class="tool-title"><span aria-hidden="true">•</span> ${esc(title)}</div>${detail ? `<div class="tool-detail">${esc(detail)}</div>` : ''}${output ? `<div class="tool-output">${esc(preview)}</div>${lines.length > 5 ? `<details><summary>+${lines.length - 5} lines</summary><pre>${esc(lines.slice(5).join('\n'))}</pre></details>` : ''}` : ''}</div>`;
}
function logEntry(l) {
  const time = l.at ? `<time class="message-time" datetime="${new Date(l.at).toISOString()}" title="${esc(new Date(l.at).toLocaleString())}">${esc(new Date(l.at).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}))}</time>` : '';

  const who = String(l.who || '');
  if (who === 'tool-item') { try { return toolEntry(JSON.parse(l.text)).replace('<div class="tool-title">', '<div class="tool-title">' + time); } catch {} }
  if (who === 'image') {
    try {
      const image = JSON.parse(l.text);
      if (/^api\/files\/\d+$/.test(image.url))
        return `<figure class="message screenshot"><a href="${image.url}" target="_blank" rel="noopener"><img src="${image.url}" alt="${esc(image.tool)}" ></a><figcaption>${time}</figcaption></figure>`;
    } catch {}
  }
  if (who === 'owner' || who.startsWith('owner via '))
    return `<div class="message owner" aria-label="Your message"><div class="message-body">${esc(l.text)}${time}</div></div>`;
  if (['agent', 'hive', 'done', 'needs you'].includes(who))
    return `<div class="message agent" aria-label="${esc(who === 'hive' ? 'Hive' : 'Agent')}"><div class="message-body">${esc(l.text)}${time}</div></div>`;
  return `<details class="activity"><summary>${esc(who)} ${time}</summary><div class="activity-body">${esc(l.text)}</div></details>`;
}
// Replace running items in place, including completions arriving in later polls.
function appendLogEntry(box, l) {
  if (l.who === 'tool-item') {
    try {
      const item = JSON.parse(l.text);
      const old = [...box.querySelectorAll('[data-tool-id]')].find(el => el.dataset.toolId === item.id);
      if (old) {
        const html = logEntry(l);
        if (old.dataset.snapshot === html) return;
        const open = old.querySelector('details')?.open;
        const template = document.createElement('template'); template.innerHTML = html;
        const next = template.content.firstElementChild;
        old.className = next.className;
        old.setAttribute('aria-busy', next.getAttribute('aria-busy'));
        old.replaceChildren(...next.childNodes);
        if (open) old.querySelector('details')?.setAttribute('open', '');
        old.dataset.snapshot = html;
        return;
      }
    } catch {}
  }
  box.insertAdjacentHTML('beforeend', logEntry(l));
}
const badge = s => `<span class="badge ${esc(s)}">${esc(s)}</span>`;
// Session identity stays stable as the same agent takes on more tasks.
function agentSessions() {
  const priority = {needs: 0, working: 1, open: 1, queued: 2};
  const sessions = new Map();
  const current = new Map((state.agents || []).map(a => [a.id, a.task_id]));
  for (const t of [...state.tasks].sort((a,b) => (priority[a.status] ?? 3) - (priority[b.status] ?? 3) || b.id-a.id)) {
    const key = t.agent_id ? `agent-${t.agent_id}` : `task-${t.id}`;
    if (!sessions.has(key) || current.get(t.agent_id) === t.id) sessions.set(key, t);
  }
  return [...sessions.values()].sort((a,b) => (priority[a.status] ?? 3) - (priority[b.status] ?? 3) || b.id-a.id);
}
function sessionTask(id) { return state.tasks.find(t => t.id === id); }
function sessionId(id) { return id; }
function taskCard(t, click = true) {
  const unread = t.latest_message > (seen[`task-${t.id}`] || 0) && chat !== t.id;
  return `<div role="button" tabindex="0" data-session="${t.id}" title="${esc(t.title)}" aria-label="${esc(t.title)} · ${esc(t.status)}${unread ? ' · unread' : ''}" class="card item ${chat === t.id ? 'sel' : ''}" ${click ? `onclick="openChat(${t.id})"` : ''}>
    <span class="session-state ${esc(t.status)}" aria-label="${esc(t.status)}"></span><span class="session-title">${esc(t.title)}</span>${unread ? '<span class="unread" aria-label="Unread"></span>' : ''}<span class="muted">${t.agent_id ? '#' + t.agent_id : ''}</span></div>`;
}
let seen = {};
try { seen = JSON.parse(localStorage.getItem('hive-seen') || '{}'); } catch {}
function markSeen() {
  const t = sessionTask(chat); if (!t) return;
  seen[`task-${t.id}`] = t.latest_message || 0;
  try { localStorage.setItem('hive-seen', JSON.stringify(seen)); } catch {}
}
async function openChat(id) { if (id !== null) id = sessionId(id); $('.split')?.classList.remove('choosing'); if (chat === id) return; chat = id; markSeen(); chatAfter = 0; render(); }
function chatTaskHeader() {
  const t = sessionTask(chat); if (!t) return '';
  return `<div class="row"><b style="flex:1;min-width:0;overflow-wrap:anywhere">Task #${t.id} · ${esc(t.title)}</b>${badge(t.status)}${['done','dropped'].includes(t.status) ? '' : `<button class="plain" onclick="dropTask(${t.id})">Drop task</button>`}</div>${t.status === 'needs' ? `<div class="task-need">${esc(t.why)}<br><b>${esc(t.need)}</b></div>` : ''}`;
}
function chatPane() {
  return `<div class="card"><div class="row"><b>${sessionTask(chat)?.agent_id ? `Agent #${sessionTask(chat).agent_id}` : `Task #${chat}`}</b><span class="muted usage" style="flex:1"></span><button class="plain" onclick="showContext(${chat})">Context</button></div>
    <div id="chat-task">${chatTaskHeader()}</div><div id="chatlog" class="log chat-log"></div>
    <div class="composer" data-composer="task-${chat}" style="margin-top:8px"><textarea id="msg" rows="2" placeholder="Message this agent">${esc(draft(`task-${chat}`).text)}</textarea><div class="attachments"></div><div class="row"><button class="plain" onclick="this.nextElementSibling.click()">Attach files</button><input type="file" multiple hidden><button data-send onclick="msgTask(${chat})">Send</button><span class="muted" role="status"></span></div></div></div>`;
}
async function showContext(id) {
  const box = $('#chatlog');
  try {
    const context = await api(`api/tasks/${id}/context`);
    if (chat !== id) return;
    let panel = box.querySelector('[data-context]');
    if (!panel) { panel = document.createElement('details'); panel.dataset.context = '1'; box.prepend(panel); }
    panel.open = true;
    panel.innerHTML = `<summary>Provider session context</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(JSON.stringify(context,null,2))}</pre>`;
  } catch (e) { alert(e.message || String(e)); }
}
function updateLog(box, rows, render) {
  if (!rows.length) return;
  const following = box.dataset.follow !== 'false';
  const anchor = following ? null : [...box.children].find(el => el.getBoundingClientRect().bottom > box.getBoundingClientRect().top);
  const offset = anchor?.getBoundingClientRect().top;
  for (const row of rows) render(row);
  if (following) box.scrollTop = box.scrollHeight;
  else if (anchor?.isConnected) { const delta = anchor.getBoundingClientRect().top - offset; box.scrollTop += delta; }
}
function followLatest(box) {
  box.dataset.follow = 'true';
  box.addEventListener('scroll', () => { box.dataset.follow = String(box.scrollTop + box.clientHeight >= box.scrollHeight - 30); });
  box.addEventListener('load', () => { if (box.dataset.follow !== 'false') box.scrollTop = box.scrollHeight; }, true);
  document.fonts.ready.then(() => { if (box.dataset.follow !== 'false') box.scrollTop = box.scrollHeight; });
}
let chatLoading = false, orchestratorLoading = false, orchestratorAfter = 0;
async function loadChat() {
  const selected = chat, box = $('#chatlog');
  if (!selected || !box || chatLoading) return;
  chatLoading = true;
  try {
    let more;
    do {
    const r = await api(`api/tasks/${selected}?session=1&after=${chatAfter}`);
    if (chat !== selected || box !== $('#chatlog')) return;
    const usage = $('.usage'); if (usage) usage.textContent = usageLabel(r.usage);
    markSeen();
    updateLog(box, r.log, l => { appendLogEntry(box, l); chatAfter = l.id; });
    more = r.log.length === 2000;
    } while (more);
  } finally { chatLoading = false; }
}
async function loadOrchestrator() {
  const box = $('#orchestrator-log');
  if (!box || orchestratorLoading) return;
  orchestratorLoading = true;
  try {
    const rows = await api(`api/orchestrator?after=${orchestratorAfter}`);
    updateLog(box, rows, l => {
      appendLogEntry(box, l.task_id > 0 && l.who !== 'image' ? {...l, text: `Task #${l.task_id} · ${l.task_title || 'Task'}${l.who === 'done' ? ' · Done' : l.who === 'needs you' ? ' · Needs you' : ''}\n\n${l.text}`} : l);
      orchestratorAfter = l.id;
    });
  } finally { orchestratorLoading = false; }
}
function updateSessions() {
  const list = $('#session-list'); if (!list) return;
  const header = $('#chat-task');
  if (header) { const html = chatTaskHeader(); if (header.innerHTML !== html) header.innerHTML = html; }
  const pinned = list.firstElementChild;
  pinned.classList.toggle('sel', chat === null);
  let needs = list.querySelector('details');
  if (!needs) { needs = document.createElement('details'); needs.open = true; needs.innerHTML = '<summary>Needs me</summary><div class=needs-sessions></div>'; list.append(needs); }
  const needsList = needs.lastElementChild;
  const existing = new Map(Array.from(list.querySelectorAll('[data-session]')).map(el => [Number(el.dataset.session), el]));
  let previous = needs, previousNeed = null;
  const sessions = agentSessions();
  needs.hidden = !sessions.some(t => t.status === 'needs');
  for (const t of sessions) {
    let el = existing.get(t.id);
    const html = taskCard(t);
    if (!el) { const template = document.createElement('template'); template.innerHTML = html; el = template.content.firstElementChild; }
    else if (el.dataset.snapshot !== html) { const template = document.createElement('template'); template.innerHTML = html; el.replaceChildren(...template.content.firstElementChild.childNodes); el.classList.toggle('sel', chat === t.id); }
    el.dataset.snapshot = html;
    if (t.status === 'needs') {
      if (previousNeed) { if (previousNeed.nextElementSibling !== el) previousNeed.after(el); }
      else if (needsList.firstElementChild !== el) needsList.prepend(el);
      previousNeed = el;
    } else { if (previous.nextElementSibling !== el) previous.after(el); previous = el; } existing.delete(t.id);
  }
  for (const el of existing.values()) el.remove();
}
let taskFilter = 'Active';
function usageLabel(u) {
  if (!u) return 'Tokens unavailable';
  return `${Number(u.total).toLocaleString()} tokens · ${Number(u.input).toLocaleString()} in · ${Number(u.output).toLocaleString()} out · ${Number(u.cached).toLocaleString()} cached`;
}
function updateTasks() {
  const board = $('#task-board'); if (!board) return;
  const sections = taskFilter === 'Done' ? [['Done', ['done','dropped']]] : [['Needs me', ['needs']], ['Working', ['working']], ['Queued', ['open','queued']], ['Idle', ['idle']]];
  const html = `<div class="row task-filters">${['Active','Done'].map(f => `<button class="${f === taskFilter ? '' : 'plain'}" onclick="taskFilter='${f}';updateTasks()">${f}</button>`).join('')}</div>` + sections.map(([label, statuses]) => {
    const tasks = state.tasks.filter(t => statuses.includes(t.status));
    return `<section><h2>${label} <span class="muted">${tasks.length}</span></h2>${tasks.map(t => `<div class="card task-row"><button class="task-open" onclick="openTask(${t.id})">${esc(t.title)}${t.quote && t.quote.trim() !== t.title?.trim() ? `<span class="task-description">${esc(t.quote)}</span>` : ''}<span class="muted">#${t.id}${t.agent_id ? ' · Agent #' + t.agent_id : ''}</span></button>${t.status === 'needs' ? `<div class="task-need">${esc(t.why)}<br><b>${esc(t.need)}</b></div><button class="plain" onclick="resumeTask(${t.id},this)">Resume</button>` : ''}${statuses.includes('done') ? '' : `<button class="plain" onclick="dropTask(${t.id})">Drop task</button>`}</div>`).join('') || '<p class="muted">No tasks.</p>'}</section>`;
  }).join('');
  if (board.dataset.snapshot !== html) { board.innerHTML = html; board.dataset.snapshot = html; }
}
async function resumeTask(id, button) {
  button.disabled = true;
  try { const r = await api(`api/tasks/${id}/message`, {method:'POST', body:{text:'Resume this task and try again.'}}); if (r.error) throw Error(r.error); await refresh(); openTask(id); }
  catch(e) { button.disabled = false; button.textContent = 'Retry resume'; alert(e.message); }
}
async function msgTask(id) { await sendComposer(`task-${id}`, `api/tasks/${sessionTask(id)?.id ?? id}/message`); loadChat(); }
async function dropTask(id) { await api(`api/tasks/${id}/drop`, { method: 'POST' }); refresh(); }
$('#view').addEventListener('keydown', e => { if (e.target.closest('[data-task]') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openTask(Number(e.target.closest('[data-task]').dataset.task)); return; } if (e.target.closest('[data-session]') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openChat(Number(e.target.closest('[data-session]').dataset.session)); return; } if (e.target.id === 'msg' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); msgTask(chat); } });

function table(rows) {
  if (!rows.length) return '<p class="muted">Nothing here.</p>';
  const cols = Object.keys(rows[0]);
  return `<div style="overflow:auto"><table><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${rows.map(r => `<tr>${cols.map(c => `<td title="${esc(r[c])}">${esc(String(r[c] ?? '').slice(0, 300))}</td>`).join('')}</tr>`).join('')}</table></div>`;
}

async function render() {
  clearTimeout(screenRetry);
  if (remoteScreen) { const old = remoteScreen; remoteScreen = null; old.disconnect(); }
  const v = $('#view');
  const sessions = tab === 'Sessions';
  $('main').classList.toggle('sessions', sessions);
  const orchestrator = $('#orchestrator');
  // Keep the pinned chat and its composer alive while switching sessions or tabs.
  $('main').insertBefore(orchestrator, v);
  orchestrator.classList.remove('active');
  if (sessions) {
    if (!$('#session-list')) v.innerHTML = `<div class="split"><button class="plain session-toggle" onclick="this.parentElement.classList.toggle('choosing')">Sessions</button><aside id="session-list" class="session-list" aria-label="Sessions"><div role="button" tabindex="0" class="card item" onclick="openChat(null)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openChat(null)}">Orchestrator · pinned</div></aside><section class="chat-panel"></section></div>`;
    updateSessions();
    if (chat === null) {
      $('.chat-panel').replaceChildren(orchestrator); orchestrator.classList.add('active');
      const box = $('#orchestrator-log'); if (!box.dataset.follow) followLatest(box); box.dataset.follow = 'true'; box.scrollTop = box.scrollHeight;
      loadOrchestrator();
    }
    else { $('.chat-panel').innerHTML = chatPane(); chatAfter = 0; followLatest($('#chatlog')); loadChat(); }
    document.querySelectorAll('.composer').forEach(paintComposer);
  } else if (tab === 'Tasks') {
    v.innerHTML = '<div id="task-board" class="task-board"></div>';
    updateTasks();
  } else if (tab === 'Rules') {
    const [rules, orchestrator] = await Promise.all([api('api/rules'), api('api/orchestrator/instructions')]);
    v.innerHTML = `<div class="card"><b>Orchestrator instructions</b> <span class="muted">what the orchestrator hears before your rules, with every request</span>
      <textarea id="otext" rows="16">${esc(orchestrator.text)}</textarea><div class="row"><button onclick="saveOrchestrator()">Save</button></div></div>
      <div class="card row"><input id="rtext" placeholder="New rule" style="flex:3"><input id="rscope" placeholder="Scope: blank, site:x.com, app:Notes, folder:/path, node:mac" style="flex:2"><button onclick="addRule()">Add</button></div>
      ${rules.map(r => `<div class="card row"><b>R${r.id}</b>${r.scope ? `<span class="badge">${esc(r.scope)}</span>` : ''}<span style="flex:1">${esc(r.text)}${r.code ? ' <span class="muted">(page change)</span>' : ''}${r.quote ? `<br><span class="muted">"${esc(r.quote)}"</span>` : ''}</span><button class="plain" onclick="delRule(${r.id})">Remove</button></div>`).join('')}`;
  } else if (tab === 'Info') {
    const info = await api('api/info');
    v.innerHTML = `<div class="card row"><input id="ikey" placeholder="Key" style="flex:1"><input id="ival" placeholder="Value" style="flex:3"><button onclick="addInfo()">Save</button></div>${table(info)}`;
  } else if (tab === 'Files') {
    const files = await api('api/files');
    v.innerHTML = `<div class="card row"><input type="file" id="up" multiple style="flex:1"><button onclick="upload()">Upload to Hive</button></div>
      ${files.map(f => `<div class="card row"><a href="api/files/${f.id}" target="_blank">${esc(f.name)}</a><span class="muted">${(f.size / 1024).toFixed(0)} KB · from ${esc(f.node)} · ${ago(f.at)}</span>${/\.(mp4|mov|webm)$/i.test(f.name) ? '<span class="badge">recording</span>' : ''}</div>`).join('') || '<p class="muted">No files yet.</p>'}`;
  } else if (tab === 'Nodes') {
    v.innerHTML = state.nodes.map(n => `<div class="card row"><b>${esc(n.name)}</b><span class="muted" style="flex:1">${esc(n.kind)} · seen ${ago(n.seen)} · ${esc(n.version || '')}</span><button data-id="${esc(n.id)}" data-name="${esc(n.name)}" onclick="forget(this.dataset.id, this.dataset.name)">Forget</button></div>`).join('') || '<p class="muted">No devices yet.</p>';
    const phone = await api('api/phone');
    v.innerHTML += `<div class="card"><div class="row"><b>iPhone</b><span class="muted" style="flex:1">${phone.connected ? 'Hive Phone is connected' : 'Hive Phone isn\'t connected'} · ${phone.paused ? 'unlocking paused: check the phone, then save the passcode again' : phone.passcode ? 'passcode saved' : 'no passcode saved'}</span></div>
      <div class="row"><input id="pin" type="password" autocomplete="off" placeholder="The iPhone's passcode: Hive may type it at the lock screen"><button onclick="savePin()">Save</button></div>
      ${phone.unregistered.map(u => `<p>An iPhone plugged into your Mac can't install Hive until it's added to your Apple developer account. <b>Add this iPhone</b> copies its UDID and opens GitHub: choose <i>Run workflow</i>, paste it, and run. In about 20 minutes, open ${phone.install ? `<a href="${esc(phone.install)}">this link</a>` : 'the Hive install link'} on that iPhone.</p>
        <div class="row"><input readonly value="${esc(u)}" style="flex:1"><button data-udid="${esc(u)}" data-github="${esc(phone.register)}" onclick="addPhone(this.dataset.udid, this.dataset.github)">Add this iPhone</button></div>`).join('')}</div>`;
    v.innerHTML += '<p class="muted">Locks</p>' + table(state.locks);
  } else if (tab === 'Screen') {
    v.innerHTML = `<div class="row"><span id="screen-status" class="muted">Connecting…</span><button onclick="render()">Reconnect</button></div><div id="remote-screen" style="height:75vh;min-height:240px;overflow:hidden"></div>`;
    const screen = $('#remote-screen');
    const retry = () => { if (screen.isConnected && tab === 'Screen') { $('#screen-status').textContent = 'Disconnected · reconnecting…'; screenRetry = setTimeout(render, 2000); } };
    try {
      const [credentials, {default: HiveRFB}] = await Promise.all([api('api/vm/credentials'), import('./api/vm/client.js')]);
      if (!screen.isConnected || tab !== 'Screen') return;
      const url = new URL('api/vm/control', location.href);
      url.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const rfb = remoteScreen = new HiveRFB(screen, url.href, {credentials, shared:true});
      rfb.scaleViewport = true;
      rfb.addEventListener('connect', () => { if ($('#screen-status')) $('#screen-status').textContent = 'Connected · click the screen to control it'; });
      rfb.addEventListener('disconnect', () => { if (remoteScreen === rfb) { remoteScreen = null; retry(); } });
      rfb.addEventListener('securityfailure', () => { if ($('#screen-status')) $('#screen-status').textContent = 'Screen authentication failed'; });
    } catch (e) { retry(); }
  } else if (tab === 'Database') {
    const tables = await api('api/db');
    v.innerHTML = `<div class="row">${tables.map(t => `<button class="plain" onclick="showTable('${t.table}')">${t.table} (${t.rows})</button>`).join('')}</div><div id="rows"></div>`;
  } else if (tab === 'Tools') {
    const tools = await api('api/tools');
    v.innerHTML = tools.map(g => `<div class="card"><b>${esc(g.node)}</b>${g.tools.map(t => `<div><code>${esc(t.name)}</code> <span class="muted">${esc(t.description)}</span></div>`).join('')}</div>`).join('');
  } else if (tab === 'Log') {
    const log = await api('api/log?limit=300');
    v.innerHTML = `<div class="card log">${log.map(l => `<div><span class="muted">${ago(l.at)} ${l.task_id ? '#' + l.task_id : ''}</span> <span class="who">${esc(l.who)}</span>${esc(l.text)}</div>`).join('')}</div>`;
  }
}
async function showTable(t) { $('#rows').innerHTML = table(await api(`api/db/${t}?limit=200`)); }
async function addRule() { await api('api/rules', { method: 'POST', body: { text: $('#rtext').value, scope: $('#rscope').value, quote: $('#rtext').value } }); render(); }
async function saveOrchestrator() { await api('api/orchestrator/instructions', { method: 'PUT', body: { text: $('#otext').value } }); render(); }
async function delRule(id) { await api(`api/rules/${id}`, { method: 'DELETE' }); render(); }
async function addInfo() { await api('api/info', { method: 'POST', body: { key: $('#ikey').value, value: $('#ival').value } }); render(); }
async function upload() { for (const f of $('#up').files) await api(`api/files?name=${encodeURIComponent(f.name)}`, { method: 'POST', body: f }); render(); }

async function refresh() {
  state = await api('api/state');
  const online = state.nodes.filter(n => Date.now() - n.seen < 90000);
  $('#nodes').innerHTML = `<span class="dot on"></span>vm ` + state.nodes.map(n => `<span class="dot ${online.includes(n) ? 'on' : ''}"></span>${esc(n.kind)}`).join(' ');
  if (tab === 'Sessions') updateSessions();
  $('#planner-usage').textContent = usageLabel(state.planner_usage);
  if (tab === 'Tasks') updateTasks();
  await Promise.all([loadChat(), loadOrchestrator()]);
}
async function start() {
  try { await api('api/me'); } catch { if (!await login()) return; $('#login').hidden = true; }
  $('#app').hidden = false; tabs(); await refresh(); await render();
  clearInterval(timer);
  timer = setInterval(() => { refresh().catch(() => {}); }, 2000);
}
start();
</script>
</body>
